name: project-groundbreak

services:
  postgres:
    image: postgres:16-alpine
    container_name: groundbreak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundbreak_dev}
      POSTGRES_USER: ${POSTGRES_USER:-groundbreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - groundbreak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-groundbreak} -d ${POSTGRES_DB:-groundbreak_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  groundbreak_postgres_data:
