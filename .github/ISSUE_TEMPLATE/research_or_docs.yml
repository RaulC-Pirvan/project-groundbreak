# .github/ISSUE_TEMPLATE/research_or_docs.yml
name: Research / Documentation
description: Track research tasks, ADRs, or documentation work
title: "[Research/Docs]: "
labels: ["type:research"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this research/docs task needed?
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Key questions
      placeholder: "- Question 1\n- Question 2"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Doc/ADR/evaluation artifact to produce
    validations:
      required: true
